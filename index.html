<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Landscape Memory Match</title>
<style>
:root{--sand:#fff9f7;--ink:#263238;--card:#ffffff;--a:#d92332;--b:#16834a;--back:#d92332;--saffron:#d9ad45;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sand:#2a2418;--ink:#fdf3dc;--card:#3a3122;color-scheme:dark}}
:root[data-theme="dark"]{--sand:#2a2418;--ink:#fdf3dc;--card:#3a3122;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(145deg,#fff 0%,#fff9f7 58%,#f0f8f2 100%);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}
h1{margin:0;font-size:1.7rem;text-align:center}
.teams{display:flex;gap:10px;width:100%;max-width:520px}
.team{flex:1;background:var(--card);border:3px solid var(--c);border-radius:18px;padding:8px;text-align:center;opacity:.62;transition:.2s;box-shadow:0 4px 12px #26323812}
.team.on{opacity:1;transform:scale(1.035);box-shadow:0 0 0 3px #d9ad4555,0 7px 18px #26323820}
.team.a{--c:var(--a)}.team.b{--c:var(--b)}
.team b{display:block;color:var(--c);font-size:1rem}
.team span{font-size:2rem;font-weight:800}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:520px}
.c{aspect-ratio:1/1;perspective:600px;border:0;background:none;padding:0;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.c.open .in,.c.done .in{transform:rotateY(180deg)}
.f,.k{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid #ffffff}
.k{background:linear-gradient(90deg,#d92332 0 22%,transparent 22%),linear-gradient(to bottom,#ffffff 0 33.3%,#16834a 33.3% 66.6%,#d92332 66.6% 100%);color:#ffffff;font-size:2rem;font-weight:900;text-shadow:0 1px 3px #26323899;box-shadow:inset 0 0 0 2px #d9ad45}
.f{transform:rotateY(180deg);background:var(--card);flex-direction:column;font-weight:800;border:3px solid #d9ad45}
.f img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.f .w{font-size:clamp(.8rem,3.6vw,1.2rem)}
.f.word{font-size:1.05rem;padding:2px;word-break:break-word}
.c.done .f{background:#e5f5e9;color:#17643a;border-color:#16834a}
.msg{min-height:2.2rem;font-size:1.3rem;font-weight:800;text-align:center}
button.new{font:700 1.1rem inherit;font-family:inherit;min-height:48px;padding:0 24px;border-radius:24px;border:2px solid #b88a24;background:linear-gradient(135deg,#fff 0 35%,#d92332 35% 48%,#16834a 48% 100%);color:#fff;text-shadow:0 1px 2px #26323888;cursor:pointer;box-shadow:0 5px 14px #26323820}
.credit{margin:0;font-weight:700}
@media (prefers-reduced-motion:reduce){.in,.team{transition:none}}
</style>
</head>
<body>
<h1>Landscape Memory Match</h1>
<div class="teams">
  <div class="team a on" id="ta"><b>Team A</b><span id="sa">0</span></div>
  <div class="team b" id="tb"><b>Team B</b><span id="sb">0</span></div>
</div>
<div class="msg" id="msg">Team A, flip two cards!</div>
<div class="board" id="board"></div>
<button class="new" id="new">New game</button>
<p class="credit">Muna Alziedi</p>

  if(!first){first=b;return}
  var a=first;first=null;lock=true;
  if(a._c.k===b._c.k&&a._c.t!==b._c.t){
    setTimeout(function(){
      a.classList.replace("open","done");b.classList.replace("open","done");
      score[turn]++;found++;lock=false;ui();
      if(found===W.length){
        msg.textContent=score[0]===score[1]?"It's a tie! 🤝":name(score[0]>score[1]?0:1)+" wins! 🎉";
      }else msg.textContent="Match! "+name(turn)+" goes again 🎯";
    },500);
  }else{
    setTimeout(function(){
      a.classList.remove("open");b.classList.remove("open");
      turn=1-turn;lock=false;ui();msg.textContent=name(turn)+", your turn!";
    },1000);
  }
}
document.getElementById("new").onclick=start;
start();
</script>
